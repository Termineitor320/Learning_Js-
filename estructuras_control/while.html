<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>
<body>
    
    <script>
        i = 0;
        while (i < 5) 
        {
            console.log("El valor de i es: " + i);
            i = i + 1;
        }



    </script>
</body>
</html>
